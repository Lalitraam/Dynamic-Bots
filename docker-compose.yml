version: "3.8"

services:
  api:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  worker:
    build: ./backend
    command: python worker.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend

  caddy:
    image: caddy:2.7-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
      - frontend
